<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Briefing do Projeto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .form-card {
            border-radius: 16px;
        }

        .form-title {
            font-weight: 700;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
        }

        .btn-send {
            padding: 10px 30px;
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                DEV Felix
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="perfil.html">
                            Perfil
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="portfolio.html">
                            Portfólio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="contato.html">
                            Contato
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <!-- FORMULÁRIO CLIENTE -->
    <div class="container my-5">

        <div class="row justify-content-center">

            <div class="col-lg-9">

                <div class="card shadow form-card">

                    <div class="card-body p-5">

                        <h2 class="text-center form-title">
                            Briefing do Projeto
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Preencha para entendermos seu projeto e criarmos sua solução
                        </p>

                        <form action="mailto:seuemail@gmail.com" method="post" enctype="text/plain">

                            <div class="row g-3">

                                <!-- CLIENTE -->
                                <div class="col-md-6">
                                    <label class="form-label">Nome do cliente</label>
                                    <input type="text" class="form-control" name="cliente" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">E-mail / WhatsApp</label>
                                    <input type="text" class="form-control" name="contato" required>
                                </div>

                                <!-- TIPO DE PROJETO -->
                                <div class="col-md-6">
                                    <label class="form-label">Tipo de projeto</label>
                                    <select class="form-select" name="tipo">
                                        <option selected>Selecione...</option>
                                        <option>Site institucional</option>
                                        <option>Landing page</option>
                                        <option>Sistema web</option>
                                        <option>Portfólio</option>
                                        <option>E-commerce</option>
                                    </select>
                                </div>

                                <!-- PRAZO -->
                                <div class="col-md-6">
                                    <label class="form-label">Prazo desejado</label>
                                    <select class="form-select" name="prazo">
                                        <option selected>Selecione...</option>
                                        <option>Urgente (até 7 dias)</option>
                                        <option>15 dias</option>
                                        <option>30 dias</option>
                                        <option>Flexível</option>
                                    </select>
                                </div>

                                <!-- OBJETIVO -->
                                <div class="col-12">
                                    <label class="form-label">Qual o objetivo do projeto?</label>
                                    <textarea class="form-control" rows="3" name="objetivo"
                                        placeholder="Ex: vender produtos, apresentar empresa, captar clientes..."></textarea>
                                </div>

                                <!-- FUNCIONALIDADES -->
                                <div class="col-12">
                                    <label class="form-label">Funcionalidades desejadas</label>

                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="Login" name="func">
                                        <label class="form-check-label">Sistema de login</label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="Pagamento" name="func">
                                        <label class="form-check-label">Integração de pagamento</label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="Contato" name="func">
                                        <label class="form-check-label">Formulário de contato</label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="Admin" name="func">
                                        <label class="form-check-label">Painel administrativo</label>
                                    </div>

                                </div>

                                <!-- ESTILO -->
                                <div class="col-md-6">
                                    <label class="form-label">Estilo desejado</label>
                                    <select class="form-select" name="estilo">
                                        <option selected>Selecione...</option>
                                        <option>Moderno</option>
                                        <option>Minimalista</option>
                                        <option>Corporativo</option>
                                        <option>Colorido / Criativo</option>
                                    </select>
                                </div>

                                <!-- REFERÊNCIA -->
                                <div class="col-md-6">
                                    <label class="form-label">Possui site de referência?</label>
                                    <input type="text" class="form-control" name="referencia"
                                        placeholder="https://...">
                                </div>

                                <!-- OBSERVAÇÕES -->
                                <div class="col-12">
                                    <label class="form-label">Observações adicionais</label>
                                    <textarea class="form-control" rows="4" name="obs"
                                        placeholder="Descreva detalhes extras do projeto..."></textarea>
                                </div>

                                <!-- BOTÃO -->
                                <div class="col-12 text-center mt-3">

                                    <button type="submit" class="btn btn-primary btn-send">
                                        Enviar Briefing
                                    </button>

                                </div>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-white py-4">

        <div class="container text-center">
            © 2026 - Dev Solutions
        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
